<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with EquiGig signature gradient -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#eqGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1"/>

  <!-- Centered Lightning Bolt Symbol (EquiGig AI Agent) -->
  <g transform="translate(4.6, 4.6) scale(0.95)" filter="url(#glow)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>

